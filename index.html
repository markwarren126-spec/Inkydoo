<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f4"><title>Art Marker Pen 2</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f4;font-family:system-ui,Arial;color:#222;overscroll-behavior:none}.app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{height:49px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:700}header small{font-size:11px;color:#888;font-weight:400}.canvas-wrap{flex:1;min-height:0;margin:0 10px;background:white;border-radius:8px;box-shadow:0 1px 8px #0001;overflow:hidden;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none}.tools{display:flex;justify-content:space-evenly;align-items:end;padding:10px 8px 7px;gap:5px}.pen{border:2px solid transparent;border-radius:13px;background:transparent;width:23%;max-width:90px;height:85px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;color:#444;font-size:12px}.pen.active{background:#e6e6e2;border-color:#292929}.pen svg{width:36px;height:56px;overflow:visible}.actions{display:flex;gap:9px;padding:0 12px 10px}button{cursor:pointer}.action{flex:1;border:1px solid #ddd;background:#fff;padding:12px 5px;border-radius:12px;font-size:14px;font-weight:600}.action.save{background:#222;color:white;border-color:#222}.action:disabled{opacity:.4}@media(min-width:700px){.app{max-width:650px;margin:auto}} </style></head><body><div class="app"><header><span>Art Marker Pen <small>2</small></span><small>Smooth ink · speed-sensitive ✏️</small></header><div class="canvas-wrap"><canvas id="canvas" aria-label="Drawing canvas"></canvas></div><div class="tools" id="tools"><button class="pen active" data-tool="fine" aria-label="Fine pen"><svg viewBox="0 0 40 65"><path d="M16 8 L24 8 L25 42 L20 58 L15 42Z" fill="#343434"/><path d="M17 8V2H23V8" fill="#aaa"/><path d="M15 42H25" stroke="white"/><path d="M20 58L18 50H22Z" fill="black"/></svg>Fine</button><button class="pen" data-tool="round" aria-label="Round marker"><svg viewBox="0 0 40 65"><rect x="12" y="9" width="16" height="38" rx="3" fill="#333"/><path d="M14 9V3Q20 -1 26 3V9Z" fill="#666"/><path d="M14 47H26L23 57Q20 62 17 57Z" fill="#222"/><path d="M15 20H25" stroke="#999"/></svg>Marker</button><button class="pen" data-tool="chisel" aria-label="Chisel marker"><svg viewBox="0 0 40 65"><path d="M11 10H29V46H11Z" fill="#444"/><path d="M12 10V3H28V10" fill="#aaa"/><path d="M11 46H29L24 59H15Z" fill="#111"/><path d="M15 59H24" stroke="#111" stroke-width="3"/></svg>Chisel</button><button class="pen" data-tool="spray" aria-label="Spray can"><svg viewBox="0 0 40 65"><rect x="9" y="16" width="22" height="43" rx="5" fill="#444"/><rect x="12" y="9" width="16" height="9" rx="2" fill="#888"/><rect x="16" y="4" width="8" height="6" rx="1" fill="#333"/><circle cx="20" cy="35" r="7" fill="#ddd"/><circle cx="20" cy="35" r="3" fill="#333"/></svg>Spray</button></div><div class="actions"><button class="action" id="undo">↶ Undo</button><button class="action" id="clear">Clear</button><button class="action save" id="save">↓ Save</button></div></div><script>
(()=>{
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),wrap=document.querySelector('.canvas-wrap');
let tool='fine',drawing=false,points=[],history=[],dpr=1,lastTime=0,inkWidth=2.5,rawPrev=null;
function resize(){const old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;old.getContext('2d').drawImage(canvas,0,0);const r=wrap.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,3);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);if(old.width)ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height)}
function snapshot(){history.push(ctx.getImageData(0,0,canvas.width,canvas.height));if(history.length>18)history.shift()}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,t:e.timeStamp}}
function midpoint(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function stamp(x,y,angle){ctx.save();ctx.translate(x,y);ctx.rotate(-Math.PI/4);ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(0,0,8,1.75,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function chiselLine(a,b){const dist=Math.hypot(b.x-a.x,b.y-a.y),steps=Math.max(1,Math.ceil(dist/.65));for(let i=0;i<=steps;i++){let t=i/steps;stamp(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,0)}}
function spray(p){ctx.fillStyle='rgba(0,0,0,.48)';for(let i=0;i<22;i++){let a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*15;ctx.beginPath();ctx.arc(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r,Math.random()*1.1+.2,0,Math.PI*2);ctx.fill()}}
function sprayLine(a,b){const n=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/3));for(let i=0;i<=n;i++)spray({x:a.x+(b.x-a.x)*i/n,y:a.y+(b.y-a.y)*i/n})}
// Slow movements deposit a broader stroke; fast movements become finer.
// Width is gently filtered to avoid jitter caused by uneven touch sampling.
function targetWidth(p,q){
 const distance=Math.hypot(q.x-p.x,q.y-p.y);
 const elapsed=Math.max(8,Math.min(90,(q.t||0)-(p.t||0)||16));
 const speed=distance/elapsed;
 const max=tool==='fine'?5.2:15, min=tool==='fine'?1.5:3.5;
 return min+(max-min)/(1+Math.pow(speed/(tool==='fine'?.42:.50),1.3));
}
function inkDot(x,y,width){ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x,y,width/2,0,Math.PI*2);ctx.fill()}
function strokeCurve(a,control,b,startWidth,endWidth){
 const length=Math.hypot(control.x-a.x,control.y-a.y)+Math.hypot(b.x-control.x,b.y-control.y);
 const steps=Math.max(1,Math.ceil(length/.8));
 for(let i=0;i<=steps;i++){
  const t=i/steps,u=1-t;
  const x=u*u*a.x+2*u*t*control.x+t*t*b.x;
  const y=u*u*a.y+2*u*t*control.y+t*t*b.y;
  inkDot(x,y,startWidth+(endWidth-startWidth)*t);
 }
}
function begin(e){e.preventDefault();snapshot();drawing=true;points=[pos(e)];rawPrev=points[0];inkWidth=tool==='fine'?3.2:9;canvas.setPointerCapture(e.pointerId);const p=points[0];if(tool==='spray')spray(p);else if(tool==='chisel')stamp(p.x,p.y);else{ctx.fillStyle='#111';ctx.beginPath();ctx.arc(p.x,p.y,inkWidth/2,0,Math.PI*2);ctx.fill()}}
function move(e){if(!drawing)return;e.preventDefault();const events=e.getCoalescedEvents?.()||[e];for(const ev of events){const raw=pos(ev),prev=points[points.length-1];
const rawDistance=Math.hypot(raw.x-rawPrev.x,raw.y-rawPrev.y);
if(rawDistance<.45)continue;
const elapsed=Math.max(8,Math.min(90,raw.t-rawPrev.t||16));
const speed=rawDistance/elapsed;
rawPrev=raw;
// The two round pens follow a gently filtered trajectory rather than
// reproducing every small finger wobble. Faster sweeps get a little more
// responsiveness, while slow movements receive more smoothing.
const alpha=(tool==='fine'||tool==='round')?Math.min(.48,Math.max(.24,.25+speed*.16)):1;
const p={x:prev.x+(raw.x-prev.x)*alpha,y:prev.y+(raw.y-prev.y)*alpha,t:raw.t};
if(Math.hypot(p.x-prev.x,p.y-prev.y)<.18)continue;
points.push(p);if(tool==='chisel'){chiselLine(prev,p)}else if(tool==='spray'){sprayLine(prev,p)}else {const next=targetWidth(prev,p),newWidth=inkWidth*.72+next*.28;if(points.length===2){const mid=midpoint(prev,p);strokeCurve(prev,prev,mid,inkWidth,newWidth)}else{const a=points[points.length-3],b=points[points.length-2],c=points[points.length-1];strokeCurve(midpoint(a,b),b,midpoint(b,c),inkWidth,newWidth)}inkWidth=newWidth}}}
function stop(e){if(!drawing)return;if(points.length>1&&(tool==='fine'||tool==='round')){const a=points[points.length-2],b=points[points.length-1];strokeCurve(midpoint(a,b),b,b,inkWidth,inkWidth)}drawing=false;points=[];rawPrev=null}
canvas.addEventListener('pointerdown',begin);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);
document.querySelectorAll('.pen').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.tool;document.querySelectorAll('.pen').forEach(x=>x.classList.toggle('active',x===b))}));
document.querySelector('#undo').onclick=()=>{if(history.length)ctx.putImageData(history.pop(),0,0)};
document.querySelector('#clear').onclick=()=>{if(!confirm('Clear your drawing?'))return;snapshot();ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width/dpr,canvas.height/dpr)};
document.querySelector('#save').onclick=()=>{canvas.toBlob(blob=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-marker-drawing.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)},'image/png')};
resize();window.addEventListener('resize',resize);
})();
</script></body></html>
